name: Build Wintle-AutoClicker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Publish
        run: dotnet publish Wintle-AutoClicker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Wintle-AutoClicker-win-x64
          path: publish/Wintle-AutoClicker.exe
